name: 'Build Preview'

on:
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Build Editor
        run: 'npm run update'

      - name: Build Packager
        run: 'npm run update-packager'

      - name: Create Changelog Page
        run: 'npm run update-whats-new'

      - name: Upload Frontend
        uses: actions/upload-artifact@v4
        id: frontend-artifact
        with:
          name: frontend
          path: src/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true
  build-backend:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
            name: macOS AArch64
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
            name: macOS x86_64
          - platform: 'ubuntu-22.04'
            args: ''
            name: Linux
          - platform: 'windows-latest'
            args: ''
            name: Windows

    runs-on: ${{ matrix.platform }}
    needs: 
      - build-frontend
    name: Build Backend
    environment: Publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable # Set this to dtolnay/rust-toolchain@nightly
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: src/

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build and Upload
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATE_PASSWORD }}
        with:
          includeDebug: true
          includeRelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "${{ join(fromJSON(steps.tauri.outputs.artifactPaths), '\n') }}"
          if-no-files-found: error
          retention-days: 1