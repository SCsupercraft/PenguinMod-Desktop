<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>PenguinMod Desktop</title>
  </head>
  <style>
    h1 {
      margin-top: 0;
      margin-bottom: 0;
    }
    h2 {
      margin-bottom: 0;
    }
    ul {
      padding-inline-start: 2rem;
    }
    code {
      white-space: break-spaces;
      text-wrap-mode: nowrap;
      border-radius: 6px;
      background-color: rgb(20, 20, 20);
      margin: 0;
      padding: 0.1em 0.3em;
      font-size: 1rem;
    }
    a {
      color: rgb(92, 135, 226);
      text-decoration: none;
    }
  </style>
  <body
    style="
      background-color: rgb(51, 51, 51);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
    "
  >
    <div style="display: flex; flex-direction: row; margin-bottom: 1rem">
      <img
        src="/images/512.png"
        style="
          width: 80px;
          height: 80px;
          margin-right: 1rem;
          display: inline-block;
        "
      />
      <div
        style="
          display: inline-flex;
          top: 0;
          height: 80px;
          flex-direction: column;
          justify-content: center;
          align-items: start;
        "
      >
        <h1>PenguinMod Desktop</h1>
        <h2 style="margin-top: 0">What's new in v<!--Version-->?</h2>
      </div>
    </div>
    <div style="color: whitesmoke; line-height: 25px; user-select: text">
      <!--Summary-->
      <!--Content-->
    </div>
    <p
      style="
        position: absolute;
        bottom: 10px;
        left: 10px;
        margin: 0px;
        color: gray;
      "
    >
      Thank you for using PenguinMod Desktop.
    </p>
    <div
      id="continue"
      style="
        position: absolute;
        bottom: 5px;
        right: 5px;
        width: 30%;
        height: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(34, 34, 34);
        border: 1px solid rgb(20, 20, 20);
        border-radius: 8px;
        box-shadow: 0px 1px 1px black;
        cursor: pointer;
      "
    >
      Continue
    </div>
    <script
      type="module"
      src="./whats-new.js"
    ></script>
  </body>
</html>
